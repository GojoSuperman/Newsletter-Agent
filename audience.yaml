# 분야마다 달라지는 것은 전부 여기. 코드에는 분야가 박혀 있지 않다.
audience: 과학을 좋아하는 일반 성인 독자 (출근길에 5분 읽는 교양 독자)
question: 오늘 저녁 대화 소재가 될 만한 발견·발사·사건인가
topics: [우주·천문, 물리·화학, 생명·의학, 지구·기후, 과학정책·산업]
pick_count: 5
tone: 쉬운 말로 풀어 쓴 존댓말. 전문용어에는 한 줄 설명을 붙인다. 과장 없이.
min_body: 600          # 요약을 쓰려면 원문이 최소 이만큼은 있어야 한다 (G1 관문)
shortlist_batch: 40    # 예선 한 묶음 크기
tier1_max: 1           # 당사자 발표(tier 1) 경쟁 면제 상한. 2로 두면 행정 공지가 자리를 차지해 1로 조정 (REPORT 실행 기록 참고)

# 채택 근거는 REPORT.md '소스 채택표' (2026-09-15 실측). 과제 제외 목록 6곳은 쓰지 않는다.
sources:
  - {name: NASA,                url: https://www.nasa.gov/news-release/feed/,                          tier: 2, kind: rss}   # 하루 3건, 웨비나·공모 공지가 섞여 면제 대신 경쟁
