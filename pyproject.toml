[project]
name = "newsletter-agent"
version = "0.1.0"
description = "AI 뉴스레터 에이전트 — 수집부터 발행까지"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=0.4",
    "openai>=1.70",
    "pydantic>=2.7",
    "feedparser>=6.0",
    "requests>=2.32",
    "trafilatura>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "anyio<4.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newsletter", "web"]
